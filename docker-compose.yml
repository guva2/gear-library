services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env, see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, where these variables are set.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    user: "${UID:?set in .env, see .env.example}:${GID:?set in .env, see .env.example}"
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env, see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env, see .env.example}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        UID: ${UID:?set in .env, see .env.example}
        GID: ${GID:?set in .env, see .env.example}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the image's node_modules instead of the bind mount's.
      - /app/node_modules

volumes:
  db-data:
